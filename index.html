<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<title>Muhasaba</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F0E8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
:root {
  color-scheme: light;
  --outer: #E9E5DB; --bg: #F3F0E8; --card: #FFFFFF; --ink: #1D1C1A; --muted: #5F5B53;
  --line: #E2DDD2; --line2: #ECE8DF; --ctrl: #DCD6C9; --inputbg: #FAF8F3; --unticked: #CFC8B9;
  --green: #2E6B4E; --on-green: #FFFFFF;
  --home-bg: #B9D3C3; --home-fg: #173828; --home-bd: #9CBFAA;
  --qaza-bg: #F2D29C; --qaza-fg: #5A3708; --qaza-bd: #E3BC78;
  --gold: #C28A1E; --gold-ink: #8A5E0E; --gold-track: #F4EBD8; --track: #ECE8DF;
  --blue: #3B7CA8;
  --off-bg: #EFEBE2; --off-bd: #CFC8B9; --off-ink: #4A463F;
  --under-bg: #E3EEE7; --under-fg: #1F4D38; --over-bg: #F6E0D6; --over-fg: #8C3517; --none-bg: #F1EEE7;
  --save-bg: #FBEBD9; --save-fg: #8A4A12; --save-dot: #B8621B;
  --scrim: rgba(29, 28, 26, 0.38); --btn-dark: #1D1C1A; --btn-dark-fg: #FFFFFF;
}
/* Dark palette kept for a future theme switch in Settings; not applied automatically. */
:root[data-theme="dark"] {
    color-scheme: dark;
    --outer: #1C1B18; --bg: #23221F; --card: #2D2B27; --ink: #EEEAE1; --muted: #A7A196;
    --line: #3E3B35; --line2: #36332E; --ctrl: #4A463F; --inputbg: #282622; --unticked: #66615A;
    --green: #4E9A72; --on-green: #0F1F17;
    --home-bg: #2F4A3B; --home-fg: #D5EADD; --home-bd: #3E6250;
    --qaza-bg: #5C4520; --qaza-fg: #F6DDB0; --qaza-bd: #7A5C2A;
    --gold: #D9A441; --gold-ink: #E3B865; --gold-track: #463B29; --track: #3A3731;
    --blue: #5B9CC8;
    --off-bg: #292724; --off-bd: #504B43; --off-ink: #C9C3B8;
    --under-bg: #1F3A2C; --under-fg: #BFE3CD; --over-bg: #4A2518; --over-fg: #F4C4AE; --none-bg: #36332E;
    --save-bg: #43301A; --save-fg: #F2C68E; --save-dot: #D98A3A;
    --scrim: rgba(0, 0, 0, 0.55); --btn-dark: #EEEAE1; --btn-dark-fg: #23221F;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--outer); }
body { font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

#app { position: relative; height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
#hdr { padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 8px 20px; display: flex; flex-direction: column; gap: 4px; }
.hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rel { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 0; font-size: 12px; font-weight: 600; background: var(--under-bg); color: var(--under-fg); }
.pill i { width: 6px; height: 6px; border-radius: 999px; background: var(--green); }
.pill.saving { background: var(--save-bg); color: var(--save-fg); }
.pill.saving i { background: var(--save-dot); }
.pill.error { background: var(--over-bg); color: var(--over-fg); }
.pill.error i { background: var(--over-fg); }
h1 { margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.arrows { display: flex; gap: 4px; }
.sq { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--ctrl); border-radius: 12px; background: var(--card); padding: 0; }
.sq[disabled] { opacity: 0.4; cursor: default; }
.sq.pri { border: 0; background: var(--blue); color: #FFFFFF; }

#scroll { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#content { display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 24px 20px; }

.score { display: flex; align-items: center; gap: 18px; padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
.ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 22px; font-weight: 700; }
.stext { display: flex; flex-direction: column; gap: 4px; }
.s1 { font-size: 17px; font-weight: 600; }
.s2 { font-size: 13px; font-weight: 600; color: var(--gold-ink); }
.s3 { font-size: 12px; color: var(--muted); }

.cat { display: flex; flex-direction: column; gap: 10px; }
.chead { display: flex; align-items: center; justify-content: space-between; }
.cname { display: flex; align-items: center; gap: 8px; }
.cname i { width: 8px; height: 8px; border-radius: 999px; }
h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ccount { font-size: 13px; font-weight: 600; color: var(--muted); }

.chips { display: grid; gap: 8px; }
.chip { position: relative; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 1px solid var(--unticked); border-radius: 14px; background: var(--card); padding: 0; }
.chip .cn { font-size: 13px; font-weight: 600; }
.chip .cs { font-size: 11px; opacity: 0.9; }
.chip.opt0, .chip.chk { background: var(--green); border-color: var(--green); color: var(--on-green); }
.chip.opt1 { background: var(--home-bg); border-color: var(--home-bd); color: var(--home-fg); }
.chip.opt2 { background: var(--qaza-bg); border-color: var(--qaza-bd); color: var(--qaza-fg); }
.chip.opt3 { background: var(--none-bg); border-color: var(--ctrl); }
.dots { display: flex; gap: 3px; height: 6px; align-items: center; }
.dots i { width: 5px; height: 5px; border-radius: 999px; border: 1px solid currentColor; }
.dots i.on { background: currentColor; }
.nm { position: absolute; top: 6px; right: 6px; width: 5px; height: 5px; border-radius: 999px; background: currentColor; opacity: 0.6; }

.card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.row { position: relative; min-height: 58px; width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 16px; border: 0; border-top: 1px solid var(--line2); background: transparent; text-align: left; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.card > .row:first-child, .card > div.row:first-child { border-top: 0; }
.tick { width: 26px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 2px solid var(--unticked); color: var(--on-green); }
.tick.on { background: var(--green); border-color: var(--green); }
.rt { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rn { font-size: 15px; font-weight: 500; }
.rs { font-size: 12px; color: var(--muted); }
.row .nm { position: static; flex-shrink: 0; color: var(--muted); }
.optbadge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--none-bg); color: var(--muted); }
.optbadge.opt0 { background: var(--green); color: var(--on-green); }
.optbadge.opt1 { background: var(--home-bg); color: var(--home-fg); }
.optbadge.opt2 { background: var(--qaza-bg); color: var(--qaza-fg); }

.nleft { flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
/* When the row is narrow (e.g. the two-column desktop layout), the value wraps under the name instead of running into the buttons. */
.nline { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 8px; }
/* Number rows in a narrow card (small phones, two-column desktop): name, value and bar on the first line,
   badge and buttons on a second line, right-aligned. Browsers without container queries keep one line. */
#content .cat > .card { container-type: inline-size; }
@container (max-width: 340px) {
  .nrow { flex-wrap: wrap; row-gap: 8px; }
  .nrow > .nleft, .nrow > .rt { flex: 1 1 calc(100% - 54px); }
  .nrow > .nleft + *, .nrow > .rt + * { margin-left: auto; }
}
.linkbtn { border: 0; background: transparent; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.nval { font-size: 13px; color: var(--muted); white-space: nowrap; }
.nval b { color: var(--ink); font-weight: 600; }
.bar { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 6px; border-radius: 999px; background: var(--blue); }
.bar.over i { background: var(--over-fg); }
.steps { display: flex; gap: 6px; }
.badge { min-width: 44px; text-align: center; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--none-bg); color: var(--muted); white-space: nowrap; }
.badge.under { background: var(--under-bg); color: var(--under-fg); }
.badge.over { background: var(--over-bg); color: var(--over-fg); }
/* "Not doing today": dimmed and neutral, never a warning colour. */
.row.hskip, .chip.hskip { opacity: 0.55; }
.skipline { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); }
.btn.skipbtn { align-self: flex-start; }
.inbox { display: flex; align-items: center; justify-content: flex-end; gap: 4px; width: 84px; height: 44px; padding: 0 10px; border: 1px solid var(--ctrl); border-radius: 12px; background: var(--inputbg); flex-shrink: 0; }
.inbox input { width: 100%; min-width: 0; border: 0; background: transparent; font-size: 16px; font-weight: 600; text-align: right; outline: none; }
.inbox span { font-size: 13px; color: var(--muted); }

.offhead { display: flex; flex-direction: column; gap: 2px; }
.offhead h2 { color: var(--muted); }
.offhead div { font-size: 12px; color: var(--muted); }
.card.off { background: var(--off-bg); border: 1px dashed var(--off-bd); }
.card.off .row { min-height: 52px; color: var(--off-ink); border-top-color: var(--line); }
.card.off .tick { width: 22px; height: 22px; }
.card.off .tick.on { background: var(--gold); border-color: var(--gold); }

#nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 12px calc(14px + env(safe-area-inset-bottom, 0px)) 12px; background: var(--card); border-top: 1px solid var(--line); }
#nav button { height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 500; }
#nav button.on { color: var(--green); font-weight: 600; }

.empty { padding: 40px 12px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.5; }
.empty h2 { color: var(--ink); margin-bottom: 6px; }

#drawer { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10; }
#drawer.hidden { display: none; }
.scrim { flex: 1 1 auto; border: 0; padding: 0; background: var(--scrim); }
.sheet { display: flex; flex-direction: column; gap: 18px; max-height: 88%; overflow-y: auto; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px; background: var(--card); border-radius: 24px 24px 0 0; }
.grab { align-self: center; width: 40px; height: 4px; border-radius: 999px; background: var(--ctrl); }
.shead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.shead h3 { margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.shead span { font-size: 13px; color: var(--muted); }
.sec { display: flex; flex-direction: column; gap: 8px; }
.slabel { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.clear { border: 0; background: transparent; padding: 6px 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; text-transform: none; }
.clear[disabled] { opacity: 0.4; cursor: default; }
.opts { display: grid; gap: 8px; }
.opt { height: 56px; border: 1.5px solid var(--ctrl); border-radius: 14px; background: var(--card); font-size: 15px; font-weight: 600; }
.opt.opt0 { background: var(--green); border-color: var(--green); color: var(--on-green); }
.opt.opt1 { background: var(--home-bg); border-color: var(--home-bd); color: var(--home-fg); }
.opt.opt2 { background: var(--qaza-bg); border-color: var(--qaza-bd); color: var(--qaza-fg); }
.opt.opt3 { background: var(--none-bg); border-color: var(--ink); }
.streakline { font-size: 14px; color: var(--muted); }
.streakline b { color: var(--ink); }
.box { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 2px solid var(--unticked); color: #FFFFFF; }
.box.on { background: var(--gold); border-color: var(--gold); }
.note { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--ctrl); border-radius: 12px; background: var(--inputbg); font-size: 15px; outline: none; }
.done { height: 52px; border: 0; border-radius: 14px; background: var(--btn-dark); color: var(--btn-dark-fg); font-size: 15px; font-weight: 600; }
/* icons */
.hico { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
.hico.sm { width: 28px; height: 28px; border-radius: 8px; }
.chip { height: 88px; }
.chip .cico { display: flex; margin-bottom: 1px; }
.card.off .hico { opacity: 0.75; }
.ghn { display: flex; align-items: center; gap: 8px; }
.shead .ttl { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ipick { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.ipick button { height: 44px; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--ctrl); border-radius: 10px; background: var(--card); color: var(--ink); padding: 0; }
.ipick button.on { border-color: var(--green); background: var(--under-bg); color: var(--under-fg); }
.igroup { font-size: 11px; font-weight: 600; color: var(--muted); margin: 6px 0 2px 0; }
.icur { display: flex; align-items: center; gap: 12px; }
/* to-do */
.tdhico { display: flex; color: var(--muted); }
.tqadd { display: flex; gap: 8px; }
.tqadd .fin { flex: 1 1 auto; min-width: 0; }
.lchips { display: flex; flex-wrap: wrap; gap: 6px; }
.lchip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1.5px solid var(--ctrl); border-radius: 999px; background: var(--card); font-size: 12px; font-weight: 600; color: var(--ink); }
.lchip i { width: 8px; height: 8px; border-radius: 999px; }
.lchip.on { border-color: var(--lc, var(--ink)); background: var(--lc, var(--ink)); color: #FFFFFF; }
.lchip.on i { background: #FFFFFF !important; }
.lcap { font-size: 12px; color: var(--muted); }
.tdmoves { display: flex; gap: 6px; flex-shrink: 0; }
.todo { display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border-top: 1px solid var(--line2); min-height: 52px; }
.tlist > .todo:first-child { border-top: 0; }
.todo.editing { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px; }
.tdchk { width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; padding: 0; }
.tdchk .tick { width: 22px; height: 22px; }
.tdtext { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; border: 0; background: transparent; padding: 8px 0; text-align: left; font-size: 15px; }
.tdtext.static { padding-left: 8px; }
.todo.isdone .tdtext > span:first-child { text-decoration: line-through; color: var(--muted); }
.ltag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.tdate { width: 100%; font-size: 12px; color: var(--muted); }
button.score.tdprog { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
button.score.tdprog:hover { border-color: var(--ctrl); }
#side .tdprog.side { margin-top: 16px; }
.tmore { font-size: 12px; color: var(--muted); padding: 8px 4px 0 4px; }
.lbmgr { display: flex; flex-direction: column; gap: 8px; }
.edbtns { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.edgroup { display: flex; align-items: center; gap: 6px; }
.linkish.muted { color: var(--muted); padding: 8px 10px; }
.btn.ghost { display: inline-flex; align-items: center; gap: 6px; border-color: var(--line); background: transparent; color: var(--ink); }
.btn.ghost:hover, .ib:hover { background: var(--line2); }
.todo.moved .tdtext > span:first-child { color: var(--muted); }
.movedico { border: 0 !important; color: var(--muted); }
.tmoved { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--save-bg); color: var(--save-fg); }
.linkish.tdundo { flex-shrink: 0; padding: 8px 6px; }
.todo.tdarch .tdtext > span:first-child { color: var(--muted); }
.tarch { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--none-bg); color: var(--muted); }
.tgroup { display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; font-weight: 600; margin-top: 4px; }
.tgroup span { font-size: 12px; font-weight: 500; color: var(--muted); }
.todoseg button { height: 40px; }
.tdgrip { cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.tlist.sorting { overflow: visible; }
.tlist.sorting .todo { -webkit-user-select: none; user-select: none; }
.todo.lifted { position: relative; z-index: 5; background: var(--card); border-radius: 12px; border-top-color: transparent; box-shadow: 0 8px 24px rgba(29, 28, 26, 0.16); }
body.grabbing, body.grabbing * { cursor: grabbing !important; }
.swatch { width: 28px; height: 28px; flex-shrink: 0; border: 0; border-radius: 999px; margin-right: 10px; padding: 0; }
.lbname { height: 40px; }
/* streaks, celebrations, prompts */
.sbadge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--green); }
.sbadge.hot { color: var(--gold-ink); }
.sbadge.risk { color: var(--save-fg); }
.streaks { gap: 2px; }
.srow { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line2); }
.srow:first-of-type { border-top: 0; }
.smain { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.sline { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sname { font-size: 14px; font-weight: 600; }
.sopt { font-weight: 500; color: var(--muted); }
.snum { display: inline-flex; align-items: center; gap: 4px; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 20px; font-weight: 700; color: var(--green); }
.snum svg { width: 16px; height: 16px; }
.snum.hot { color: var(--gold-ink); }
.snum.zero { color: var(--unticked); }
.sbar i { background: var(--gold); }
.srow.risk .sbar i { background: var(--save-dot); }
.ssub { font-size: 12px; color: var(--muted); line-height: 1.5; }
.ssub b { color: var(--save-fg); }
#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); max-width: calc(100% - 40px); padding: 12px 18px; border-radius: 14px; background: var(--btn-dark); color: var(--btn-dark-fg); font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; z-index: 60; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.confetti { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 70; }
.nudges { display: flex; flex-direction: column; gap: 8px; }
.nudge { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--save-bg); color: var(--save-fg); font-size: 13px; line-height: 1.45; }
.nudge.recap { background: var(--under-bg); color: var(--under-fg); }
.nudge .linkish { color: inherit; flex-shrink: 0; }
@media (min-width: 900px) { #toast { bottom: 32px; } }
@media (prefers-reduced-motion: no-preference) {
  .tick.pop, .chip.pop, .box.pop { animation: pop 0.35s ease-out; }
  .sbadge.pulse { animation: pulse 0.5s ease-out; transform-origin: left center; }

      var gsec = document.querySelectorAll('[data-gsec]');
      for (var gi = 0; gi < gsec.length; gi++) {
        var gsc = gsec[gi].getAttribute('data-gsec') === id ? gsec[gi].querySelector('.gscroll') : null;
        if (gsc) gsc.scrollLeft = gsc.scrollWidth;
      }
    }
    else if (act === 'ed-new-habit') { openHabitEditor(null); }
    else if (act === 'ed-new-cat') { openCatEditor(null); }
    else if (act === 'ed-habit') { openHabitEditor(id); }
    else if (act === 'ed-cat') { openCatEditor(id); }
    else if (act === 'ed-cancel') { state.editor = null; render(); }
    else if (act === 'ed-retro') { state.editor.retro = !!t.checked; }
    else if (act === 'ed-save') { if (state.editor.kind === 'cat') saveCatDraft(); else saveHabitDraft(); }
    else if (act === 'ed-type') {
      var dr = state.editor.draft, ty = t.getAttribute('data-v');
      dr.type = ty;
      if (ty === 'number') { if (!dr.config.direction) dr.config.direction = 'atleast'; if (dr.config.step === undefined) dr.config.step = 1; }
      if (ty === 'choice' && !dr.config.options) dr.config.options = [{ label: '', points: 1 }];
      keepSheetScroll(render);
    }
    else if (act === 'ed-day') {
      var dd = state.editor.draft.days, di = +t.getAttribute('data-i');
      state.editor.draft.days = dd.slice(0, di) + (dd.charAt(di) === '1' ? '0' : '1') + dd.slice(di + 1);
      keepSheetScroll(render);
    }
    else if (act === 'ed-iconpick') { state.editor.pickIcon = !state.editor.pickIcon; keepSheetScroll(render); }
    else if (act === 'ed-icon') { state.editor.draft.config.icon = t.getAttribute('data-v'); state.editor.pickIcon = false; keepSheetScroll(render); }
    else if (act === 'ed-input') { state.editor.draft.config.input = t.getAttribute('data-v'); keepSheetScroll(render); }
    else if (act === 'ed-dir') { state.editor.draft.config.direction = t.getAttribute('data-v'); keepSheetScroll(render); }
    else if (act === 'ed-optadd') { state.editor.draft.config.options.push({ label: '', points: 1 }); keepSheetScroll(render); }
    else if (act === 'ed-optdel') { state.editor.draft.config.options.splice(+t.getAttribute('data-i'), 1); keepSheetScroll(render); }
    else if (act === 'ed-addonadd') { state.editor.draft.config.addons.push({ label: '', bonus: 0.5 }); keepSheetScroll(render); }
    else if (act === 'ed-addondel') { state.editor.draft.config.addons.splice(+t.getAttribute('data-i'), 1); keepSheetScroll(render); }
    else if (act === 'ed-archive') {
      var ah = habitById(state.editor.draft.id);
      ah.archived = keyOf(today);
      state.editor = null; render();
      serverCall('saveHabits', [ah]);
    }
    else if (act === 'ed-delcat') {
      var cid = state.editor.draft.id;
      DATA.categories = DATA.categories.filter(function (x) { return x.id !== cid; });
      state.editor = null; render();
      serverCall('deleteCategory', cid);
    }
    else if (act === 'h-up' || act === 'h-down') { moveHabit(id, act === 'h-up' ? -1 : 1); }
    else if (act === 'cat-up' || act === 'cat-down') { moveCat(id, act === 'cat-up' ? -1 : 1); }
    else if (act === 'h-restore') { var rh = habitById(id); rh.archived = ''; render(); serverCall('saveHabits', [rh]); }
    else if (act === 'toggle-arch') { state.showArchived = !state.showArchived; render(); }
    else if (act === 'set-save') { saveSettingsForm(); }
    else if (act === 'td-add') { addTodo(t.getAttribute('data-in')); }
    else if (act === 'td-label') { state.todoLabel = t.getAttribute('data-v'); keepScroll(render); }
    else if (act === 'td-filter') { state.todoFilter = t.getAttribute('data-v'); keepScroll(render); }
    else if (act === 'td-mode') { state.todoMode = t.getAttribute('data-v'); state.editTodo = null; if (state.todoMode === 'day') state.offset = 0; render(); }
    else if (act === 'td-openall') { state.view = 'todo'; state.todoMode = 'pending'; state.editTodo = null; render(); document.getElementById('scroll').scrollTop = 0; window.scrollTo(0, 0); }
    else if (act === 'td-toggle' || act === 'td-archive' || act === 'td-move' || act === 'td-tomorrow' || act === 'td-restore') {
      var td = todoById(t.getAttribute('data-tid'));
      if (!td) return;
      if (act === 'td-move' || act === 'td-tomorrow') checkDay(true);
      if (act === 'td-toggle') {
        /* Ticking a to-do with no date puts it on today, so the done item has a day to show on. */
        if (!td.done && !td.date) { checkDay(true); td.date = keyOf(today); }
        td.done = !td.done;
        state.flash = 'td:' + td.id;
        if (td.done) {
          buzz(8);
          var sameDay = todosOn(td.date);
          if (sameDay.length > 1 && sameDay.every(function (x) { return x.done || x.deferredTo || x.archived; })) setTimeout(function () { toast('List cleared for ' + relDay(td.date).toLowerCase() + '. Nice.'); listCleared(); }, 50);
        }
      }
      if (act === 'td-archive') { td.archived = true; state.editTodo = null; }
      if (act === 'td-restore') td.archived = false;
      var changed = { save: [td], del: [] };
      if (act === 'td-move') changed = deferTodo(td, keyOf(today));
      if (act === 'td-tomorrow') { changed = deferTodo(td, tomorrowKey()); state.editTodo = null; }
      keepScroll(render);
      saveMoves(changed);
    }
    else if (act === 'td-moveall') {
      checkDay(true);
      var mv = pendingTodos(state.todoFilter || '').filter(function (x) { return x.date && x.date !== keyOf(today); });
      var saved = { save: [], del: [] };
      mv.forEach(function (x) { var r = deferTodo(x, keyOf(today)); saved.save = saved.save.concat(r.save); saved.del = saved.del.concat(r.del); });
      keepScroll(render);
      saveMoves(saved);
    }
    else if (act === 'td-undo') {
      checkDay(true);
      var uo = todoById(t.getAttribute('data-tid'));
      if (!uo || !uo.deferredTo) return;
      if (!canUndoMove(uo)) { toast('The moved copy was already done or moved again.'); keepScroll(render); return; }
      var ur = undoMove(uo, copyOf(uo));
      keepScroll(render);
      saveMoves(ur);
    }
    else if (act === 'td-archdone') {
      var dn = todosOn(keyOfView()).filter(function (x) { return x.done; });
      dn.forEach(function (x) { x.archived = true; });
      keepScroll(render);
      if (dn.length) serverCall('saveTodos', dn);
    }
    else if (act === 'td-delete') {
      var did = t.getAttribute('data-tid');
      DATA.todos = todos().filter(function (x) { return x.id !== did; });
      keepScroll(render);
      serverCall('deleteTodos', [did]);
    }
    else if (act === 'td-edit') {
      var te = todoById(t.getAttribute('data-tid'));
      state.editTodo = te.id; state.editTodoLabel = te.label || ''; state.editTodoText = te.text; state.focusId = 'te-' + te.id;
      keepScroll(render);
    }
    else if (act === 'td-elabel') {
      var cur = document.getElementById('te-' + state.editTodo);
      if (cur) state.editTodoText = cur.value;
      state.editTodoLabel = t.getAttribute('data-v'); state.focusId = 'te-' + state.editTodo;
      keepScroll(render);
    }
    else if (act === 'td-esave') { saveTodoEdit(t.getAttribute('data-tid')); }
    else if (act === 'td-ecancel') { state.editTodo = null; keepScroll(render); }
    else if (act === 'prog-mode') { state.progMode = t.getAttribute('data-v'); state.sel = null; render(); window.scrollTo(0, 0); document.getElementById('scroll').scrollTop = 0; }
    else if (act === 'nudge-x') { dismiss(t.getAttribute('data-k')); keepScroll(render); }
    else if (act === 'td-opentab') { state.view = 'todo'; state.todoMode = 'day'; state.editTodo = null; render(); document.getElementById('scroll').scrollTop = 0; window.scrollTo(0, 0); }
    else if (act === 'td-labels') { state.labelsOpen = !state.labelsOpen; keepScroll(render); }
    else if (act === 'lb-add') {
      var lb = { id: newId('l'), name: 'New label', color: LABEL_COLORS[labels().length % LABEL_COLORS.length], order: Date.now() };
      DATA.labels = labels().concat([lb]);
      keepScroll(render);
      serverCall('saveLabels', [lb]);
    }
    else if (act === 'lb-color') {
      var lc = labelById(id), ci = LABEL_COLORS.indexOf(lc.color);
      lc.color = LABEL_COLORS[(ci + 1) % LABEL_COLORS.length];
      keepScroll(render);
      serverCall('saveLabels', [lc]);
    }
    else if (act === 'lb-del') {
      var gone = todos().filter(function (x) { return x.label === id; });
      gone.forEach(function (x) { x.label = ''; });
      DATA.labels = labels().filter(function (x) { return x.id !== id; });
      if (state.todoLabel === id) state.todoLabel = '';
      if (state.todoFilter === id) state.todoFilter = '';
      keepScroll(render);
      serverCall('deleteLabel', id);
      if (gone.length) serverCall('saveTodos', gone);
    }
  });

  function keepScroll(fn) {
    var sc = document.getElementById('scroll'), top = sc.scrollTop, wy = window.pageYOffset;
    var lefts = [], gs = document.querySelectorAll('.gscroll');
    for (var i = 0; i < gs.length; i++) lefts.push(gs[i].scrollLeft);
    fn();
    sc.scrollTop = top; window.scrollTo(0, wy);
    var gs2 = document.querySelectorAll('.gscroll');
    if (gs2.length === lefts.length) { for (var j = 0; j < gs2.length; j++) gs2[j].scrollLeft = lefts[j]; }
  }
  function keepSheetScroll(fn) {
    var sh = document.querySelector('.sheet'), top = sh ? sh.scrollTop : 0;
    fn();
    var sh2 = document.querySelector('.sheet');
    if (sh2) sh2.scrollTop = top;
  }
  function onField(e) {
    var t = e.target;
    if (!t || !t.getAttribute || !state.editor) return;
    var f = t.getAttribute('data-f');
    if (!f) return;
    setPath(state.editor.draft, f, t.type === 'checkbox' ? t.checked : t.value);
  }
  document.addEventListener('input', onField);
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute || !t.getAttribute('data-lid')) return;
    var l = labelById(t.getAttribute('data-lid')), name = String(t.value).trim();
    if (!l || !name || name === l.name) return;
    l.name = name;
    serverCall('saveLabels', [l]);
    keepScroll(render);
  });
  document.addEventListener('change', onField);

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var id = t.getAttribute('data-id');
    if (t.className === 'numin') {
      var raw = String(t.value).replace(',', '.').trim();
      setChange('v', id, raw === '' || isNaN(parseFloat(raw)) ? null : raw);
    } else if (t.className === 'note') {
      var txt = String(t.value).trim();
      setChange('n', id, txt === '' ? null : txt);
    }
  });

  document.addEventListener('keydown', function (e) {
    var kt = e.target;
    if (kt && kt.className && e.key === 'Enter') {
      if (kt.className.indexOf('todoin') >= 0) { e.preventDefault(); addTodo(kt.id); return; }
      if (kt.className.indexOf('todoedit') >= 0) { e.preventDefault(); saveTodoEdit(kt.getAttribute('data-tid')); return; }
    }
    /* Keyboard reordering from a to-do's grip; focus follows the item. */
    if (kt && kt.getAttribute && kt.getAttribute('data-grip') && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault();
      state.focusId = kt.id;
      if (!moveTodo(kt.getAttribute('data-tid'), e.key === 'ArrowUp' ? -1 : 1)) state.focusId = null;
      return;
    }
    if (e.key === 'Escape' && state.editTodo) { state.editTodo = null; keepScroll(render); return; }
    if (e.key === 'Escape' && (state.drawer || state.editor)) { state.drawer = null; state.editor = null; render(); }
  });

  /* The day always starts at midnight, but the installed app can stay open past it. The date is checked
     every minute, on focus, on return, and right before a to-do is moved (before: always updates, never
     redraws, as the move redraws). Mid-edit or mid-drag nothing changes; the next check catches up.
     Returns true if it redrew. */
  function checkDay(before) {
    var t = startOfToday(), n = daysBetween(today, t), a = document.activeElement;
    var typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
    if (!n || (!before && (drag || state.editTodo || state.editor || state.drawer || (typing && a.value)))) return false;
    today = t;
    /* On today: follow it to the new day, except under a move on the To-do Day view, so the list being
       worked on stays put. Any other day keeps showing the same date. */
    if (state.offset || (before && canGoForward())) state.offset += n;
    /* Manage has nothing dated and may hold unsaved settings, so it isn't redrawn. */
    if (before || state.view === 'habits') return false;
    if (typing && a.id) state.focusId = a.id;
    keepScroll(render);
    return true;
  }
  setInterval(function () { checkDay(); }, 60000);
  window.addEventListener('focus', function () { checkDay(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') { leaving(); return; }
    returnedAt = Date.now();
    if (!checkDay()) render();
    /* Anything unsent goes out at once; the refresh below is skipped while it is unsaved, so ask for one once it is. */
    resumeSaving();
    if (!refresh() && DATA && getKey() && unsaved()) convergeAfter = true;
  });
  /* The network came back: same as returning to the app. */
  window.addEventListener('online', resumeSaving);
  /* Leaving the page (closing, reloading, switching away on a phone): copy to the device, then send what is queued. */
  window.addEventListener('pagehide', leaving);

  window.addEventListener('beforeunload', function (e) {
    if (queue.length || inFlight || pendingEdits || failedEdits.length) { e.preventDefault(); e.returnValue = ''; }
  });

  document.getElementById('gateretry').addEventListener('click', boot);
  boot();
})();
</script>
</body>
</html>
